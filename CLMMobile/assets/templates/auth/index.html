{% extends 'base.html' %}
{% block title %}CLMMobile - Login{% endblock %}
{% block css %}
<link rel="stylesheet" href="{{ url_for('auth.static', filename='css/auth/style.css') }}">
{% endblock %}
{% block content %}
<form action="{{ url }}" method="post">
    <h1>Login</h1>
    {% if error %}
    <p style="color: red;">{{error}}</p>
    {% endif %}
    <input type="password" name="password" placeholder="password">
    <input type="hidden" name="next" value="{{ next or '' }}">
    <button type="submit">Login</button>
</form>
{% endblock %}
