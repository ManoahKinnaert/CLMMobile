<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('time_service.static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('time_service.static', filename='css/auth_service/login.css') }}">
</head>
<body>
    <div class="titlebar">
        <h1>CLM Timer</h1>
    </div>
    <div class="content">
        <h1>Login - Timer</h1>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <form action="{{ url_for('time_service.login') }}" method="post">
        <input type="password" name="passcode" placeholder="passcode">
        <button type="submit">Enter</button>
    </form>
    </div>
    
</body>
</html>
