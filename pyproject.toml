[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "CLMMobile"
version = "0.0.1"
description = "A meeting timer utility"
authors = [{name = "Manoah Kinnaert"}]
requires-python = ">=3.9"
dependencies = [
    "flask==3.1.3",
    "flask-socketio==5.6.1",
    "qrcode==8.2",
    "Pillow==11.3.0",
    "peewee==4.5.2",
    "fpdf2==2.8.4",
    "pywebview==6.2.1",
    "gevent"
]

[tool.setuptools]
include-package-data = true 

[tool.setuptools.packages.find]
include = ["CLMMobile*"]

[tool.setuptools.package-data]
CLMMobile = [
    "assets/**/*"
]